<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriSmart — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #171717;
      border: 1px solid #262626;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #fff; }
    p { color: #a3a3a3; font-size: 0.925rem; line-height: 1.6; }
    .badge {
      margin-top: 1.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #262626;
      border: 1px solid #404040;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      color: #34d399;
      font-weight: 600;
    }
    .reload-btn {
      margin-top: 1.5rem;
      background: #059669;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reload-btn:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌾</div>
    <h1>Internet La'aanteed (Offline)</h1>
    <p>Ma jiro xiriir internet xilligan.<br/>AgriSmart waxay kuu keydisay xogihii hore si aad u sii isticmaasho.</p>
    <div class="badge">● AgriSmart PWA Offline Mode</div>
    <div>
      <button class="reload-btn" onclick="window.location.reload()">Isku day Mar Kale</button>
    </div>
  </div>
</body>
</html>
